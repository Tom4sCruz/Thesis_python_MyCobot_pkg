[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "armik"
version = "1.0.0"
description = "Cartesian IK control for the myCobot 280, built on pymycobot"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
hardware = ["pymycobot>=3.6"]

[tool.setuptools.packages.find]
include = ["armik*"]
